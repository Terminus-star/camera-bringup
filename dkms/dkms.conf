# dkms.conf for the experimental AMD ISP4 capture module (amd_isp4_capture.ko)
#
# Expected source layout (what dkms/install.sh prints the commands for):
#   /usr/src/amd-isp4-capture-0.1.0/
#       dkms.conf  Kbuild  Makefile  check-generated-headers.sh (mode 755)
#       driver/    *.c, *.h (including the 3 generated headers), Kbuild
#
# DKMS copies that tree to /var/lib/dkms/amd-isp4-capture/0.1.0/build/ and runs
# MAKE there.  Checked against dkms 3.4.3 (/usr/bin/dkms), which:
#   - prefixes the MAKE command with "make -j<jobs> KERNELRELEASE=<kernelver>",
#   - itself appends LLVM=1 when the kernel was built with clang; the Makefile
#     does the same detection from ${kernel_source_dir}/.config so older dkms
#     versions and manual builds behave the same (LLVM=1 twice is harmless),
#   - runs PRE_BUILD only if the script is executable (-x), with arguments,
#   - no longer runs CLEAN (only warns that it is deprecated); it is kept for
#     older dkms versions, which run it before building.

PACKAGE_NAME="amd-isp4-capture"
PACKAGE_VERSION="0.1.0"

BUILT_MODULE_NAME[0]="amd_isp4_capture"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"

# The Makefile reads ${kernel_source_dir}/.config and adds LLVM=1 only for a
# clang-built kernel (CONFIG_CC_IS_CLANG=y).
MAKE[0]="make KDIR=${kernel_source_dir} modules"
CLEAN="make KDIR=${kernel_source_dir} clean"

# Fails early, with a readable message, if the generated headers are missing
# or the kernel's amdgpu lacks the ISP buffer helpers.
PRE_BUILD="check-generated-headers.sh ${kernel_source_dir}"

# Skip (instead of failing) kernels whose amdgpu has no ISP support at all, and
# kernels older than the first one with the exported ISP buffer helpers.
BUILD_EXCLUSIVE_CONFIG="CONFIG_DRM_AMD_ISP"
BUILD_EXCLUSIVE_KERNEL_MIN="6.17"

AUTOINSTALL="yes"
